<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="base :: layout(~{::section})">

<head>
    <meta charset="UTF-8"/>
    <title>My Profile</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
</head>

<body>
<section>

    <div class="container mt-5 p-5 bg-light">
        <div class="row">
            <div class="col-md-10 offset-md-1">

                <p class="fs-3 text-center">My Profile</p>
                <hr/>

                <!-- Profile Image: Cloudinary URL and legacy local image support -->
                <div class="text-center mb-3">

                    <img th:src="${user.profileImage != null and !#strings.isEmpty(user.profileImage)
                            ? (#strings.startsWith(user.profileImage, 'http')
                                ? user.profileImage
                                : (#strings.contains(user.profileImage, 'profile_img/')
                                    ? '/uploads/' + user.profileImage
                                    : '/uploads/profile_img/' + user.profileImage))
                            : '/uploads/profile_img/default.jpg'}"
                         th:alt="${user.name != null ? user.name : 'Profile'}"
                         class="border p-2"
                         style="width:110px; height:110px; border-radius:50%; object-fit:cover;"
                         onerror="this.onerror=null; this.src='/uploads/profile_img/default.jpg';"/>

                </div>

                <!-- Flash messages -->
                <div th:if="${succMsg}" class="text-success text-center"
                     th:text="${succMsg}"></div>

                <div th:if="${errorMsg}" class="text-danger text-center"
                     th:text="${errorMsg}"></div>

                <!-- Profile Update Form -->
                <div class="col-md-8 offset-md-2 mt-4">

                    <form id="profileUpdateForm"
                          th:action="@{/admin/update-profile}"
                          th:object="${user}"
                          method="post"
                          enctype="multipart/form-data">

                        <!-- CSRF token -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <input type="hidden" th:field="*{id}"/>

                        <table class="table table-borderless">
                            <tbody>

                            <tr>
                                <th>Name</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:field="*{name}"
                                           class="form-control"/>
                                </td>
                            </tr>

                            <tr>
                                <th>Mobile Number</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:field="*{mobileNumber}"
                                           class="form-control"/>
                                </td>
                            </tr>

                            <tr>
                                <th>Email</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:value="${user.email}"
                                           class="form-control" readonly/>
                                </td>
                            </tr>

                            <tr>
                                <th>Address</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:field="*{address}"
                                           class="form-control"/>
                                </td>
                            </tr>

                            <tr>
                                <th>City</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:field="*{city}"
                                           class="form-control"/>
                                </td>
                            </tr>

                            <tr>
                                <th>State</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:field="*{state}"
                                           class="form-control"/>
                                </td>
                            </tr>

                            <tr>
                                <th>Pin Code</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:field="*{pinCode}"
                                           class="form-control"/>
                                </td>
                            </tr>

                            <!-- Image upload with client-side validation -->
                            <tr>
                                <th>Image</th>
                                <td>:</td>
                                <td>
                                    <input type="file"
                                           id="imageFile"
                                           name="imageFile"
                                           class="form-control"
                                           accept="image/*"/>

                                    <div id="imageError"
                                         class="text-danger mt-1"
                                         style="display:none;"
                                         role="alert"></div>

                                    <div class="form-text">
                                        Supported image files only. Maximum size: 5 MB.
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <th>Role</th>
                                <td>:</td>
                                <td>
                                    <input type="text" th:value="${user.role}"
                                           class="form-control" readonly/>
                                </td>
                            </tr>

                            <tr>
                                <th>Account Status</th>
                                <td>:</td>
                                <td>
                                    <input type="text"
                                           th:value="${user.isEnable ? 'Enabled' : 'Disabled'}"
                                           class="form-control" readonly/>
                                </td>
                            </tr>

                            <tr>
                                <td></td>
                                <td colspan="2" class="text-center">
                                    <button class="btn btn-primary btn-sm"
                                            type="submit">
                                        Update
                                    </button>
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </form>
                </div>

                <hr/>

                <!-- Change Password Section -->
                <p class="text-center fs-3 mt-4">Change Password</p>

                <div th:if="${pwdSuccess}" class="text-success text-center"
                     th:text="${pwdSuccess}"></div>

                <div th:if="${pwdError}" class="text-danger text-center"
                     th:text="${pwdError}"></div>

                <div class="col-md-6 offset-md-3">

                    <form id="changePasswordForm"
                          th:action="@{/admin/change-password}"
                          method="post"
                          novalidate>

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <table class="table table-borderless">
                            <tbody>

                            <tr>
                                <th>Current Password</th>
                                <td>
                                    <input id="currentPassword"
                                           type="password"
                                           name="currentPassword"
                                           class="form-control"
                                           required/>
                                </td>
                            </tr>

                            <tr>
                                <th>New Password</th>
                                <td>
                                    <input id="newPassword"
                                           type="password"
                                           name="newPassword"
                                           class="form-control"
                                           required
                                           minlength="6"/>

                                    <div class="form-text">
                                        Minimum 6 characters.
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <th>Confirm Password</th>
                                <td>
                                    <input id="confirmPassword"
                                           type="password"
                                           name="confirmPassword"
                                           class="form-control"
                                           required/>

                                    <div id="pwdMismatchMsg"
                                         class="form-text text-danger mt-1"
                                         style="display:none;"
                                         role="alert">
                                        New password and Confirm password do not match.
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td></td>
                                <td class="text-center">
                                    <button id="changePwdBtn"
                                            class="btn btn-primary btn-sm"
                                            type="submit">
                                        Update
                                    </button>
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </form>
                </div>

                <!-- Image and password validation -->
                <script>
                    document.addEventListener("DOMContentLoaded", function () {

                        // Profile image validation
                        const imageInput = document.getElementById("imageFile");
                        const imageError = document.getElementById("imageError");
                        const profileForm = document.getElementById("profileUpdateForm");
                        const MAX_SIZE = 5 * 1024 * 1024; // 5 MB

                        function validateImage() {
                            imageError.textContent = "";
                            imageError.style.display = "none";

                            const file = imageInput.files[0];

                            if (!file) {
                                return true;
                            }

                            if (!file.type.startsWith("image/")) {
                                imageError.textContent =
                                    "Invalid file type. Please select an image.";
                                imageError.style.display = "block";
                                imageInput.value = "";
                                return false;
                            }

                            if (file.size > MAX_SIZE) {
                                imageError.textContent =
                                    "Image size must not exceed 5 MB. Please select a smaller image.";
                                imageError.style.display = "block";
                                imageInput.value = "";
                                return false;
                            }

                            return true;
                        }

                        imageInput.addEventListener("change", validateImage);

                        profileForm.addEventListener("submit", function (event) {
                            if (!validateImage()) {
                                event.preventDefault();
                                event.stopPropagation();
                                imageInput.focus();
                            }
                        });

                        // Change password validation
                        const passwordForm =
                            document.getElementById("changePasswordForm");
                        const newPwd =
                            document.getElementById("newPassword");
                        const confirmPwd =
                            document.getElementById("confirmPassword");
                        const pwdMsg =
                            document.getElementById("pwdMismatchMsg");

                        function validatePasswordMatch() {
                            confirmPwd.classList.remove("is-invalid");
                            pwdMsg.style.display = "none";

                            if (newPwd.value && newPwd.value.length < 6) {
                                confirmPwd.classList.add("is-invalid");
                                pwdMsg.textContent =
                                    "New password must be at least 6 characters.";
                                pwdMsg.style.display = "block";
                                return false;
                            }

                            if (newPwd.value && confirmPwd.value &&
                                newPwd.value !== confirmPwd.value) {

                                confirmPwd.classList.add("is-invalid");
                                pwdMsg.textContent =
                                    "New password and Confirm password do not match.";
                                pwdMsg.style.display = "block";
                                return false;
                            }

                            return true;
                        }

                        newPwd.addEventListener("input", validatePasswordMatch);
                        confirmPwd.addEventListener("input", validatePasswordMatch);

                        passwordForm.addEventListener("submit", function (event) {
                            if (!validatePasswordMatch()) {
                                event.preventDefault();
                                event.stopPropagation();
                                confirmPwd.focus();
                            }
                        });

                    });
                </script>

            </div>
        </div>
    </div>

</section>
</body>
</html>
