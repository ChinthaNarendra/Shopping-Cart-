<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base :: layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
</head>
<body>
<section>
    <div class="container-fluid p-5 mt-5">
        <div class="row">

            <!-- Left: Edit Category Form -->
            <div class="col-md-3 offset-md-5">
                <div class="card card-sh">
                    <div class="card-header text-center">
                        <p class="fs-4">Edit Category</p>
                    </div>

                    <div class="p-3">
                        <th:block th:if="${succMsg}">
                            <div class="text-success text-center fw-bold" th:text="${succMsg}"></div>
                        </th:block>

                        <th:block th:if="${errorMsg}">
                            <div class="text-danger text-center fw-bold" th:text="${errorMsg}"></div>
                        </th:block>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/admin/updateCategory}" th:object="${category}" method="post" enctype="multipart/form-data">
                            <!-- HIDDEN id so the server receives the existing entity id -->
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Enter Category</label>
                                <!-- th:field handles both value and name attributes -->
                                <input type="text" th:field="*{name}" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{active}" th:value="true" id="radioActive" />
                                    <label class="form-check-label" for="radioActive">Active</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{active}" th:value="false" id="radioInactive" />
                                    <label class="form-check-label" for="radioInactive">Inactive</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Upload Image</label>
                                <input type="file" name="file" class="form-control" accept="image/*" />
                            </div>

                            <!-- show existing image (guarded) -->
                            <div th:if="${category.imageName}">
                                <img th:src="@{/img/category_img/{img}(img=${category.imageName})}"
                                     th:alt="${category.name}" width="100" height="100" style="object-fit:cover; margin-bottom:8px;" />
                            </div>

                            <button type="submit" class="btn btn-primary col-md-12 mt-2">Update</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<script th:inline="javascript">
/*<![CDATA[*/
setTimeout(function(){
    var alerts = document.querySelectorAll('.alert');
    alerts.forEach(function(a){ a.style.display = 'none'; });
}, 3000);
/*]]>*/
</script>
</body>
</html>
