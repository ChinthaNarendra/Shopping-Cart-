
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="base :: layout(~{::section})">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>

<body>
<section>

    <!-- ------------------ Slider ------------------ -->
    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img th:src="@{/img/ecom1.png}"
                     class="d-block w-100"
                     alt="Slide 1"
                     height="350">
            </div>

            <div class="carousel-item">
                <img th:src="@{/img/ecom3.png}"
                     class="d-block w-100"
                     alt="Slide 2"
                     height="350">
            </div>

            <div class="carousel-item">
                <img th:src="@{/img/ecom2.png}"
                     class="d-block w-100"
                     alt="Slide 3"
                     height="350">
            </div>

        </div>

        <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>

        <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!-- ------------------ End Slider ------------------ -->


    <!-- ------------------ Category Section ------------------ -->
    <div class="container mt-4">
        <div class="row">

            <p class="text-center fs-4">Category</p>

            <div class="col-md-2 mb-3" th:each="c : ${categorys}">
                <div class="card rounded-circle shadow p-3 mb-5 bg-body-tertiary rounded"
                     style="overflow: hidden;">

                    <div class="card-body text-center">

                        <a th:href="@{'/products?category=' + ${c.name}}">

                            <!-- Supports Cloudinary URLs and old local filenames -->
                            <img th:src="${c.imageName != null and !c.imageName.isEmpty() ? (#strings.startsWith(c.imageName, 'http') ? c.imageName : '/uploads/category_img/' + c.imageName) : '/uploads/category_img/default.jpg'}"
                                 th:alt="${c.name}"
                                 style="width: 65%; height: 140px; object-fit: contain;"
                                 onerror="this.onerror=null; this.src='/uploads/category_img/default.jpg';">
                        </a>

                        <br>

                        <a th:href="@{'/products?category=' + ${c.name}}"
                           th:text="${c.name}"
                           class="text-decoration-none"
                           style="color: black;">
                            Category Name
                        </a>

                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${#lists.isEmpty(categorys)}">
                <p class="text-center">No categories available.</p>
            </div>

        </div>
    </div>
    <!-- ------------------ End Category Section ------------------ -->


    <!-- ------------------ Latest Product Section ------------------ -->
    <div class="container-fluid bg-light p-3 mt-4">
        <div class="row">

            <p class="text-center fs-4 w-100">Latest Products</p>

            <div class="col-md-3 mb-3" th:each="p : ${products}">
                <div class="card shadow p-3 mb-2 bg-body-tertiary">

                    <div class="card-body text-center">

                        <a th:href="@{'/product/' + ${p.id}}">

                            <!-- Supports Cloudinary URLs and old local filenames -->
                            <img th:src="${p.image != null and !p.image.isEmpty() ? (#strings.startsWith(p.image, 'http') ? p.image : '/uploads/product_img/' + p.image) : '/uploads/product_img/default.jpg'}"
                                 th:alt="${p.title}"
                                 style="width: 65%; height: 140px; object-fit: cover;"
                                 onerror="this.onerror=null; this.src='/uploads/product_img/default.jpg';">
                        </a>

                        <br>

                        <a th:href="@{'/product/' + ${p.id}}"
                           th:text="${p.title}"
                           class="text-decoration-none"
                           style="color: black;">
                            Product Title
                        </a>

                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${#lists.isEmpty(products)}">
                <p class="text-center">No products to show.</p>
            </div>

        </div>
    </div>
    <!-- ------------------ End Latest Product Section ------------------ -->

</section>
</body>
</html>
