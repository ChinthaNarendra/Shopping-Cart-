<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base :: layout(~{::section})">

<head>
	<meta charset="UTF-8">
	<title>Category</title>
</head>

<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<div class="row">

				<!-- Left: Add Category Form -->
				<div class="col-12 col-md-4 col-lg-3 mb-4">
					<div class="card card-sh">
						<div class="card-header text-center">
							<p class="fs-4">Add Category</p>
						</div>

						<div class="p-3">
							<div th:if="${succMsg}" class="text-success text-center fw-bold" th:text="${succMsg}"></div>
							<div th:if="${errorMsg}" class="text-danger text-center fw-bold" th:text="${errorMsg}"></div>
						</div>

						<div class="card-body">
							<form th:action="@{/admin/saveCategory}" th:object="${category}" method="post"
								enctype="multipart/form-data">
								
								<!-- CSRF token -->
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

								<div class="mb-3">
									<label class="form-label">Enter Category</label>
									<input type="text" th:field="*{name}" class="form-control" required />
								</div>

								<div class="mb-3">
									<label class="form-label">Status</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" th:field="*{active}"
											th:value="true" id="radioActive" />
										<label class="form-check-label" for="radioActive">Active</label>
									</div>

									<div class="form-check">
										<input class="form-check-input" type="radio" th:field="*{active}"
											th:value="false" id="radioInactive" />
										<label class="form-check-label" for="radioInactive">Inactive</label>
									</div>
								</div>

								<div class="mb-3">
									<label class="form-label">Upload Image</label>
									<input type="file" name="file" class="form-control" accept="image/*" />
								</div>

								<button type="submit" class="btn btn-primary w-100 mt-2">Save</button>
							</form>
						</div>
					</div>
				</div>

				<!-- Right: Category List -->
				<div class="col-12 col-lg-8">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Category Details</div>

						<div class="card-body table-responsive">
							<table class="table align-middle">
								<thead>
									<tr>
										<th>Sl No</th>
										<th>Category</th>
										<th>Image</th>
										<th>Status</th>
										<th>Action</th>
									</tr>
								</thead>

								<tbody>
									<tr th:each="cat, iterStat : ${categories}">
										<td th:text="${iterStat.count}">1</td>
										<td th:text="${cat.name}">Category</td>

										<td>
											<img th:if="${cat.imageName != null && cat.imageName != ''}"
												th:src="@{/uploads/category_img/{img}(img=${cat.imageName})}"
												width="50" height="50" style="object-fit:cover; border-radius:6px;" />

											<img th:unless="${cat.imageName != null && cat.imageName != ''}"
												th:src="@{/uploads/category_img/default.jpg}"
												width="50" height="50" style="object-fit:cover; border-radius:6px;" />
										</td>

										<td>
											<span th:text="${cat.active} ? 'Active' : 'Inactive'">Active</span>
										</td>

										<td>
											<a th:href="@{/admin/editCategory/{id}(id=${cat.id})}"
												class="btn btn-warning btn-sm me-1">Edit</a>

											<!-- Delete form: POST + CSRF (safer than GET) -->
											<form th:action="@{/admin/deleteCategory/{id}(id=${cat.id})}" method="post"
												  style="display:inline;">
												<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
												<button type="submit" class="btn btn-danger btn-sm"
													onclick="return confirm('Are you sure you want to delete this category?');">
													Delete
												</button>
											</form>
										</td>
									</tr>

									<tr th:if="${#lists.isEmpty(categories)}">
										<td colspan="5" class="text-center text-muted">No categories found.</td>
									</tr>
								</tbody>
							</table>

							<!-- Pagination -->
							<div class="row mt-3 align-items-center">
								<div class="col-md-4 mb-2">Total Categories: <span th:text="${totalElements}"></span></div>

								<div class="col-md-8">
									<nav aria-label="Page navigation">
										<ul class="pagination justify-content-end mb-0">
											<li class="page-item" th:classappend="${isFirst} ? 'disabled'">
												<a class="page-link"
													th:href="@{'/admin/category?pageNo=' + ${pageNo - 1}}">&laquo;</a>
											</li>

											<li th:each="i : ${#numbers.sequence(1, totalPages)}"
												th:classappend="${pageNo + 1 == i} ? 'active'" class="page-item">
												<a class="page-link" th:text="${i}"
													th:href="@{'/admin/category?pageNo=' + ${i - 1}}"></a>
											</li>

											<li class="page-item" th:classappend="${isLast} ? 'disabled'">
												<a class="page-link"
													th:href="@{'/admin/category?pageNo=' + ${pageNo + 1}}">&raquo;</a>
											</li>
										</ul>
									</nav>
								</div>
							</div>

						</div>

					</div>
				</div>

			</div>
		</div>
	</section>

</body>

</html>
