<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base :: layout(~{::section})">

<head>
	<meta charset="ISO-8859-1">
	<title>Add Product</title>
</head>

<body>
	<section>
		<div class="container p-5 mt-3">
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<div class="card card-sh">

						<!-- ✅ success and error messages at top -->
						<th:block th:if="${succMsg}">
							<div class="text-success text-center fw-bold" th:text="${succMsg}"></div>
						</th:block>

						<th:block th:if="${errorMsg}">
							<div class="text-danger text-center fw-bold" th:text="${errorMsg}"></div>
						</th:block>

						<div class="card-header text-center">
							<p class="fs-4">Add Product</p>
						</div>

						<div class="card-body">
							<form th:action="@{/admin/saveProduct}" method="post" enctype="multipart/form-data">

								<div class="mb-3">
									<label>Enter Title</label>
									<input type="text" name="title" class="form-control" required>
								</div>

								<div class="mb-3">
									<label>Enter Description</label>
									<textarea rows="3" name="description" class="form-control" required></textarea>
								</div>

								<div class="mb-3">
									<label>Category</label>
									<select class="form-control" name="category" required>
										<option value="">--select--</option>
										<option th:each="c : ${categories}" th:value="${c.name}" th:text="${c.name}"></option>
									</select>
								</div>

								<div class="mb-3">
									<label>Enter Price</label>
									<input type="number" name="price" class="form-control" required>
								</div>

								<!-- ✅ STATUS section added here -->
								<div class="mb-3">
									<label class="form-label">Status</label>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive" value="true" id="radioActive" checked>
										<label class="form-check-label" for="radioActive">Active</label>
									</div>

									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive" value="false" id="radioInactive">
										<label class="form-check-label" for="radioInactive">Inactive</label>
									</div>
								</div>
								<!-- ✅ END STATUS -->

								<div class="row">
									<div class="mb-3 col">
										<label>Enter Stock</label>
										<input type="text" name="stock" class="form-control" required>
									</div>

									<div class="mb-3 col">
										<label>Upload Image</label>
										<input type="file" name="file" class="form-control" accept="image/*">
									</div>
								</div>

								<button class="btn btn-primary col-md-12 mt-2">Submit</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- ✅ auto-hide success message -->
	<script th:inline="javascript">
		setTimeout(function () {
			var alerts = document.querySelectorAll('.alert');
			alerts.forEach(function (a) { a.style.display = 'none'; });
		}, 3000);
	</script>
</body>

</html>
