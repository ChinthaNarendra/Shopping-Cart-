<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base :: layout(~{::section})">

<head>
	<meta charset="UTF-8" />
	<title>Login</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
</head>

<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="row">
				<div class="col-md-6 p-5 d-flex align-items-center justify-content-center">
					<img th:src="@{/img/ecom.png}" alt="ecom" style="width:100%; max-height:400px; object-fit:cover;">
				</div>

				<div class="col-md-6 mt-5 p-5">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-header">
							<p class="fs-4 text-center mb-0">Forgot Password</p>
							<th:block th:if="${succMsg}">
								<p class="text-success text-center fw-bold" th:text="${succMsg}"></p>
							</th:block>

							<th:block th:if="${errorMsg}">
								<p class="text-danger text-center fw-bold" th:text="${errorMsg}"></p>
							</th:block>

						</div>

						<div class="card-body">

							<form th:action="@{/forgot-password}" method="post">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
								<div class="mb-3">
									<label class="form-label">Email</label>
									<input class="form-control" name="email" type="email" placeholder="Enter your email"
										required />
								</div>
								<div class="text-center">
									<button type="submit" class="btn bg-primary text-white">Send</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
