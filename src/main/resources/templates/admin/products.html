<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base :: layout(~{::section})">

<head>
	<meta charset="UTF-8" />
	<title>All Products</title>
</head>

<body>
	<section>
		<div class="container-fluid mt-5 p-5">
			<div class="row">
				<!--<div class="col-12 mb-2 d-flex justify-content-between align-items-center">-->
				<p class="text-center fs-3 mb-0">All Products</p>
				<hr>
				<a th:href="@{/admin/}" class="text-decoration-none"><i class="fa-solid fa-arrow-left"></i> Back</a>
				<!-- </div>-->

				<!-- Search -->
				<div class="col-md-6 p-4">
					<!-- Adjust action to the controller handling product search -->
					<form th:action="@{/admin/products}" method="get" role="search" class="row g-2">
						<div class="col">
							<input type="text" class="form-control" name="ch" placeholder="Enter Product title"
								th:value="${param.q}" />
						</div>
						<div class="col-auto">
							<button class="btn btn-primary">Search</button>
						</div>
					</form>
				</div>
			</div>

			<div class="card card-sh mt-3">
				<div class="card-body">
					<!-- Single place to show flash messages -->
					<div th:if="${succMsg}" class="text-success text-center fw-bold" th:text="${succMsg}"></div>
					<div th:if="${errorMsg}" class="text-danger text-center fw-bold" th:text="${errorMsg}"></div>

					<table class="table align-middle table-bordered">
						<thead class="table-light">
							<tr>
								<th scope="col">Sl No</th>
								<th scope="col">Image</th>
								<th scope="col">Title</th>
								<th scope="col">Category</th>
								<th scope="col">Price</th>
								<th scope="col">Discount (%)</th>
								<th scope="col">Discount Price</th>
								<th scope="col">Status</th>
								<th scope="col">Stock</th>
								<th scope="col">Action</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="p, stat : ${products}">
								<th scope="row" th:text="${stat.count}">1</th>

								<td class="text-center">
									<!-- Use two img tags with th:if for clearer fallback -->
									<img th:if="${p.image != null}"
										th:src="@{/uploads/product_img/{img}(img=${p.image})}"
										th:alt="${p.title}" width="60" height="60"
										style="object-fit:cover; border-radius:6px;" />

									<img th:if="${p.image == null}"
										th:src="@{/uploads/product_img/default.jpg}"
										th:alt="${p.title} (default)" width="60" height="60"
										style="object-fit:cover; border-radius:6px;" />
								</td>

								<td th:text="${p.title}">Product title</td>
								<td th:text="${p.category}">Category</td>

								<!-- Price: format to two decimals -->
								<td th:text="${p.price != null} ? ${#numbers.formatDecimal(p.price,1,2)} : '0.00'">1000
								</td>

								<!-- Discount percentage -->
								<td th:text="${p.discount != null ? p.discount : 0}">0</td>

								<!-- Discount price (2 decimals) -->
								<td
									th:text="${p.discountPrice != null ? #numbers.formatDecimal(p.discountPrice,1,2) : '0.00'}">
									0.00
								</td>

								<!-- Status -->
								<td>
									<span th:text="${p.isActive} ? 'Active' : 'Inactive'">Active</span>
								</td>

								<td th:text="${p.stock}">10</td>

								<!-- Actions: edit + delete (delete via form POST) -->
								<td class="text-center">
									<div class="d-flex justify-content-center align-items-center gap-2 flex-nowrap">
										<a th:href="@{'/admin/editProduct/' + ${p.id}}"
											class="btn btn-sm btn-warning d-flex align-items-center">
											<i class="fa-solid fa-pen-to-square me-1"></i> Edit
										</a>

										<!-- Delete should generally be POST/DELETE, not GET -->
										<form th:action="@{'/admin/deleteProduct/' + ${p.id}}" method="post"
											th:onsubmit="return confirm('Are you sure you want to delete this product?');"
											style="display:inline-block;">
											<!-- If using Spring Security CSRF -->
											<input type="hidden" th:name="${_csrf.parameterName}"
												th:value="${_csrf.token}" />
											<!-- If your controller expects method override -->
											<input type="hidden" name="_method" value="delete" />
											<button type="submit"
												class="btn btn-sm btn-danger d-flex align-items-center">
												<i class="fa-solid fa-trash me-1"></i> Delete
											</button>
										</form>
									</div>
								</td>
							</tr>

							<tr th:if="${#lists.isEmpty(products)}">
								<td colspan="10" class="text-center text-muted">No products found.</td>
							</tr>
						</tbody>
					</table>

					<!-- TODO: add pagination controls here if products can be many -->
					<!-- Pagination -->
					<div class="row mt-3">
						<div class="col-md-4">Total Products: <span th:text="${totalElements}"></span></div>

						<div class="col-md-6">
							<ul class="pagination">
								<li class="page-item" th:classappend="${isFirst} ? 'disabled'">
									<a class="page-link"
										th:href="@{'/admin/products?pageNo=' + ${pageNo - 1}}">&laquo;</a>
								</li>

								<li th:each="i : ${#numbers.sequence(1, totalPages)}"
									th:classappend="${pageNo + 1 == i} ? 'active'" class="page-item">
									<a class="page-link" th:text="${i}"
										th:href="@{'/admin/products?pageNo=' + ${i - 1}}"></a>
								</li>

								<li class="page-item" th:classappend="${isLast} ? 'disabled'">
									<a class="page-link"
										th:href="@{'/admin/products?pageNo=' + ${pageNo + 1}}">&raquo;</a>
								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- Auto-hide flash messages -->
	<script th:inline="javascript">
		setTimeout(function () {
			var alerts = document.querySelectorAll('.alert');
			alerts.forEach(function (a) {a.style.display = 'none';});
		}, 3000);
	</script>
</body>

</html>
