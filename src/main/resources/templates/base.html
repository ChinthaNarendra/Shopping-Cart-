<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="layout(content)">

<head>
	<meta charset="UTF-8">
	<title th:text="${title}">Base Layout</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />

	<!-- fixed missing closing '>' -->
	<link rel="stylesheet" href="/css/style.css" />
</head>

<body>
	<!--Nav Bar Start-->
	<nav class="navbar navbar-expand-lg bg-primary fixed-top navbar-dark">
		<div class="container-fluid">
			<a class="navbar-brand" th:href="@{/}"><i class="fa-solid fa-cart-shopping"></i> Ecom Store</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<!-- left links -->
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<th:block th:if="${user==null}">
						<li class="nav-item">
							<a class="nav-link" aria-current="page" th:href="@{/}"><i class="fa-solid fa-house"></i>
								Home</a>
						</li>
					</th:block>

					<th:block th:unless="${user==null}">
						<li th:if="${user.role=='ROLE_USER'}" class="nav-item">
							<a class="nav-link" aria-current="page" th:href="@{/}"><i
									class="fa-solid fa-house"></i>
								Home</a>
						</li>
				
					
						<li th:if="${user.role=='ROLE_ADMIN'}" class="nav-item">
							<a class="nav-link" aria-current="page" th:href="@{/admin/}"><i
									class="fa-solid fa-house"></i>
								Home</a>
						</li>
					</th:block>



					<li class="nav-item">
						<a class="nav-link" aria-current="page" th:href="@{/products}">Products</a>
					</li>
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false">Category</a>
						<ul class="dropdown-menu">
							<!-- ✅ Fixed Thymeleaf syntax -->
							<li th:each="c : ${categorys}">
								<a class="dropdown-item" th:href="@{'/products?category=' + ${c.name}}">
									[[${c.name}]]
								</a>
							</li>
						</ul>
					</li>
				</ul>

				<!-- right links: show different items depending on auth status -->
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<th:block th:if="${user==null}">
						<!-- visible only to anonymous (not logged in) -->
						<li class="nav-item" sec:authorize="isAnonymous()">
							<a class="nav-link" th:href="@{/signin}"><i class="fa-solid fa-arrow-right-to-bracket"></i>
								LOGIN</a>
						</li>
						<li class="nav-item" sec:authorize="isAnonymous()">
							<a class="nav-link" th:href="@{/register}">REGISTER</a>
						</li>


					</th:block>
					<!-- visible only to logged-in users -->
					<th:block th:if="${user!=null}">
						<th:block th:if="${user.role=='ROLE_USER'}">
							<li class="nav-item" sec:authorize="hasRole('ADMIN')">
								<a class="nav-link" th:href="@{/user/cart}"> <i class="fa-solid fa-cart-shopping"></i>
									Cart[ [[${countCart}]] ]</a>
							</li>
						</th:block>
						<li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
							<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
								<i class="fa-solid fa-user-tie me-1"></i> [[${user.name}]]
							</a>

							<ul class="dropdown-menu dropdown-menu-end p-2">
								<th:block th:if="${user.role=='ROLE_ADMIN'}">
									<li><a class="dropdown-item" th:href="@{/admin/}">Admin Dashboard</a></li>
								</th:block>
								<th:block th:if="${user.role=='ROLE_USER'}">
									<li><a class="dropdown-item" th:href="@{/user/user-orders}">My Orders</a></li>
								</th:block>
								<th:block th:if="${user.role=='ROLE_USER'}">
									<li><a class="dropdown-item" th:href="@{/user/profile}">My Profile</a></li>
								</th:block>
								<th:block th:if="${user.role=='ROLE_ADMIN'}">
									<li><a class="dropdown-item" th:href="@{/admin/profile}">My Profile</a></li>
								</th:block>
								<li>
									<hr class="dropdown-divider">
								</li>
								<li>
									<form th:action="@{/logout}" method="post">
										<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
										<button class="dropdown-item"><i
												class="fa-solid fa-right-from-bracket me-1"></i> Logout</button>
									</form>
								</li>
							</ul>
						</li>
					</th:block>
				</ul>
			</div>
		</div>
	</nav>
	<!--Nav Bar End-->

	<div th:replace="${content}"></div>

	<!--Start Footer-->
	<div class="container-fluid p-1 bg-primary text-center text-white" style="margin-top: 250px;">
		<p>ecom.com</p>
	</div>
	<!--End Footer-->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
